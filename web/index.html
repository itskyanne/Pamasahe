<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Pamasahe — Davao Commute Fare Tracker">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Pamasahe">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Pamasahe — Commute Fare Tracker</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Suppress Flutter default blue loading line at top of browser */
    .flutter-loader,
    div[style*="background-color: rgb(1, 117, 194)"],
    div[style*="background-color: #0175C2"],
    div[style*="background: rgb(1, 117, 194)"],
    div[style*="background: #0175C2"],
    div[style*="top: 0px"][style*="position: fixed"] {
      display: none !important;
      opacity: 0 !important;
      visibility: hidden !important;
      height: 0 !important;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #0B3D3A;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      user-select: none;
    }

    #app-loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at 50% 40%, #154D49 0%, #0B3D3A 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999999;
      color: white;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    #app-loading-screen.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loading-logo-box {
      width: 76px;
      height: 76px;
      border-radius: 22px;
      background: linear-gradient(135deg, #1F8A4C 0%, #0B3D3A 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4), 0 0 0 2px rgba(255, 255, 255, 0.15);
      margin-bottom: 18px;
      animation: pulse-glow 2.2s infinite ease-in-out;
    }

    .loading-title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin: 0 0 6px 0;
      color: #FFFFFF;
    }

    .loading-subtitle {
      font-size: 13px;
      font-weight: 500;
      color: #A1B8B3;
      margin: 0 0 28px 0;
      letter-spacing: 0.2px;
    }

    .spinner-ring {
      width: 32px;
      height: 32px;
      border: 3.2px solid rgba(255, 255, 255, 0.15);
      border-top-color: #34D399;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes pulse-glow {
      0%, 100% { transform: scale(1); box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4); }
      50% { transform: scale(1.05); box-shadow: 0 16px 36px rgba(31, 138, 76, 0.45); }
    }
  </style>
</head>
<body>
  <!-- Custom Branded App Loading Screen replacing the top blue line -->
  <div id="app-loading-screen">
    <div class="loading-logo-box">
      <!-- Bus transit icon in SVG -->
      <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="15" rx="3"></rect>
        <path d="M3 9h18"></path>
        <circle cx="7.5" cy="14.5" r="1.5" fill="#FFFFFF"></circle>
        <circle cx="16.5" cy="14.5" r="1.5" fill="#FFFFFF"></circle>
        <path d="M5 18v2"></path>
        <path d="M19 18v2"></path>
      </svg>
    </div>
    <h1 class="loading-title">Pamasahe</h1>
    <p class="loading-subtitle">Davao Commute Fare Tracker</p>
    <div class="spinner-ring"></div>
  </div>

  <script>
    // Smooth fade-out when Flutter paints the first frame
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('app-loading-screen');
      if (splash) {
        splash.classList.add('fade-out');
        setTimeout(function () { splash.remove(); }, 550);
      }
    });

    // MutationObserver fallback to catch when Flutter DOM mounts
    var observer = new MutationObserver(function (mutations, obs) {
      if (document.querySelector('flutter-view') || document.querySelector('flt-glass-pane')) {
        var splash = document.getElementById('app-loading-screen');
        if (splash) {
          splash.classList.add('fade-out');
          setTimeout(function () { splash.remove(); }, 550);
        }
        obs.disconnect();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });

    // Safety timeout after 4.5 seconds
    setTimeout(function () {
      var splash = document.getElementById('app-loading-screen');
      if (splash) {
        splash.classList.add('fade-out');
        setTimeout(function () { splash.remove(); }, 550);
      }
    }, 4500);
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
