<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="pamasahe">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>pamasahe</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      background-color: #F8FAF9 !important;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }
    flutter-view, canvas, flt-glass-pane {
      background-color: #F8FAF9 !important;
      outline: none !important;
      -webkit-tap-highlight-color: transparent !important;
    }
    @keyframes pamasahe-pulse {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(200%); }
    }
  </style>
</head>
<body style="background-color: #F8FAF9;">
  <div id="loading-screen" style="position: fixed; inset: 0; background: #F8FAF9; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 999999; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;">
    <div style="color: #0B3D3A; font-size: 42px; font-weight: 800; letter-spacing: -1.2px;">Pamasahe</div>
    <div style="font-family: monospace; font-size: 11px; font-weight: 700; letter-spacing: 2.2px; color: #165B47; margin-top: 6px;">COMMUTE FARE TRACKER</div>
    <div style="margin-top: 28px; width: 130px; height: 4px; background: #EAF4F1; border-radius: 999px; overflow: hidden; position: relative;">
      <div style="position: absolute; top: 0; bottom: 0; left: 0; width: 45%; background: #1F8A4C; border-radius: 999px; animation: pamasahe-pulse 1.2s infinite ease-in-out;"></div>
    </div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('loading-screen');
      if (loader) {
        loader.style.transition = 'opacity 0.25s ease';
        loader.style.opacity = '0';
        setTimeout(function() {
          if (loader.parentNode) loader.parentNode.removeChild(loader);
        }, 250);
      }
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
